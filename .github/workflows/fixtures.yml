name: fixtures

on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fixtures
  cancel-in-progress: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch today's fixtures
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: python3 tools/fetch_fixtures.py

      - name: Publish
        run: |
          git config user.name "fixtures-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs
          if git diff --staged --quiet; then
            echo "nothing changed"
          else
            git commit -m "fixtures: $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
